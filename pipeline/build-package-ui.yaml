resources:
    repositories:
        - repository: self
          type: git
          ref: refs/heads/main
        - repository: 1esPipelines
          type: git
          name: 1ESPipelineTemplates/1ESPipelineTemplates
          ref: refs/tags/release

# SFI ES-4.2.4 (S360 pipeline def 53). Restores from the CFS feed using the build
# identity, since it runs in the org that hosts the feed.
#
# Publishing to public npmjs goes through ESRP Release rather than a direct `npm publish`,
# which CFSClean blocks. Until ESRP Release onboarding lands the esrp* parameters below stay
# empty: the pipeline builds, tests and packs the tarball and publishes it as a build
# artifact, but does not release. See ESRP-RELEASE-ONBOARDING.md for the steps and the
# values to fill in here.

extends:
    template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
    parameters:
        pool:
            os: linux
            image: ubuntu-22.04-secure
            name: $(a11yInsightsPool)
        sdl:
            sourceAnalysisPool:
                name: $(a11yInsightsPool)
                image: windows-2022-secure
                os: windows
        # SFI ES-4.2.4: CFSClean blocks the public package feeds. Permissive is the base
        # policy; 1ES currently overrides it with the centrally-applied DefaultDeny.
        settings:
            networkIsolationPolicy: Permissive,CFSClean
        stages:
            - stage: Stage
              jobs:
                  - template: pipeline/build-package.template.yaml@self
                    parameters:
                        suffix: ui
                        # Fill these in once ESRP Release onboarding is complete; see
                        # ESRP-RELEASE-ONBOARDING.md. The release job is not compiled in
                        # while esrpConnectedServiceName is empty.
                        esrpConnectedServiceName: ''
                        esrpKeyVaultName: ''
                        esrpSignCertName: ''
                        esrpClientId: ''
                        esrpOwner: ''
                        esrpApprover: ''
