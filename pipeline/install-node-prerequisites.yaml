parameters:
    # CFS feed to restore from (SFI ES-4.2.4). Empty uses whatever .yarnrc.yml specifies.
    - name: feedRegistry
      type: string
      default: ''

    # ARM service connection, required only when this pipeline's org differs from the
    # feed's. Must be a literal string, not a $(variable).
    - name: azureSubscription
      type: string
      default: ''

steps:
    - task: NodeTool@0
      inputs:
          # Keep this in sync with /.github/workflows/ci.yml
          versionSpec: '20.17.0'
      displayName: use node 20.17.0
      timeoutInMinutes: 2
      retryCountOnTaskFailure: 2

    # Sets YARN_NPM_* variables, which later steps inherit as environment variables.
    - template: ./authenticate-yarn-feed.yaml
      parameters:
          feedRegistry: ${{ parameters.feedRegistry }}
          azureSubscription: ${{ parameters.azureSubscription }}

    - script: yarn install --immutable
      displayName: install packages and dependencies
      timeoutInMinutes: 10
      retryCountOnTaskFailure: 2
