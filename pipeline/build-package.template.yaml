parameters:
    - name: suffix
      type: string

    # Passed through to install-node-prerequisites.yaml. This template is used by the
    # package release pipelines, which restore from the CFS feed and run under the
    # SFI ES-4.2.4 CFSClean policy set by their wrappers.
    - name: azureSubscription
      type: string
      default: ''

    # ESRP Release. Must be literal strings, not $(variables): resolved at compile time.
    # The release job is only compiled in when esrpConnectedServiceName is set.
    - name: esrpConnectedServiceName
      type: string
      default: ''

    - name: esrpKeyVaultName
      type: string
      default: ''

    - name: esrpSignCertName
      type: string
      default: ''

    - name: esrpClientId
      type: string
      default: ''

    # Individual aliases only; ESRP rejects DLs and SGs, and approver must differ from owner.
    - name: esrpOwner
      type: string
      default: ''

    - name: esrpApprover
      type: string
      default: ''

jobs:
    - job: 'build_and_publish_package'

      templateContext:
          outputs:
              - output: buildArtifacts
                displayName: publish npm tarball
                PathtoPublish: $(Build.ArtifactStagingDirectory)/npm-packages
                ArtifactName: npm-package-${{ parameters.suffix }}
                timeoutInMinutes: 5

      steps:
          - template: install-node-prerequisites.yaml
            parameters:
                azureSubscription: ${{ parameters.azureSubscription }}

          - script: yarn lint:check
            displayName: check lint errors

          - script: yarn format:check
            displayName: check formatting errors

          - script: yarn copyright:check
            displayName: check copyrightheaders

          - script: yarn scss:build
            displayName: generate typings for scss files

          - script: yarn type:check
            displayName: type check code
            timeoutInMinutes: 3

          - script: yarn test --ci
            displayName: run unit tests

          - task: PublishTestResults@2
            inputs:
                testResultsFiles: $(System.DefaultWorkingDirectory)/test-results/unit/junit.xml
                testRunTitle: $(Agent.JobName)
            condition: always()
            displayName: publish test results

          - task: PublishCodeCoverageResults@1
            inputs:
                codeCoverageTool: Cobertura
                summaryFileLocation: $(System.DefaultWorkingDirectory)/test-results/unit/coverage/cobertura-coverage.xml
                failIfCoverageEmpty: true
                # We care most about the summary information; adding the detailed files doesn't give enough extra information
                # to be worth the 1min it adds to the build.
                # Consider re-enabling this once https://github.com/Microsoft/azure-pipelines-tasks/issues/4945 is resolved.
                # reportDirectory: $(System.DefaultWorkingDirectory)/test-results/unit/coverage/lcov-report
            displayName: publish code coverage

          # CI build only
          - task: ComponentGovernanceComponentDetection@0
            displayName: 'Component Detection'
            condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI'))
            inputs:
                verbosity: Normal

          - script: yarn build:package:${{ parameters.suffix }}
            displayName: build:package:${{ parameters.suffix }}

          # npm pack, not yarn pack: same code path the previous npm publish used, so the
          # tarball is unchanged. ESRP distributes prebuilt .tgz files, it does not build.
          - script: |
                set -euo pipefail
                mkdir -p "$(Build.ArtifactStagingDirectory)/npm-packages"
                npm pack --pack-destination "$(Build.ArtifactStagingDirectory)/npm-packages"
                ls -l "$(Build.ArtifactStagingDirectory)/npm-packages"
            displayName: pack accessibility-insights-${{ parameters.suffix }}
            workingDirectory: $(System.DefaultWorkingDirectory)/packages/${{ parameters.suffix }}
            timeoutInMinutes: 3

    # EsrpRelease must be in a release job: 1ESPT injects Steps/DisallowReleaseSteps.yml into
    # every agent job and blocks `esrprelease` there. Release jobs are exempt.
    - ${{ if ne(parameters.esrpConnectedServiceName, '') }}:
          - job: 'publish_package'
            dependsOn: 'build_and_publish_package'

            templateContext:
                type: releaseJob
                isProduction: true
                inputs:
                    - input: pipelineArtifact
                      artifactName: npm-package-${{ parameters.suffix }}
                      targetPath: $(Pipeline.Workspace)/npm-packages

            steps:
                # ESRP auto-approves; the package ships the moment this runs. Both pipelines
                # are manual-trigger-only by design — do not add a CI or PR trigger.
                - task: EsrpRelease@12
                  displayName: publish accessibility-insights-${{ parameters.suffix }} to npmjs
                  timeoutInMinutes: 20
                  inputs:
                      connectedservicename: ${{ parameters.esrpConnectedServiceName }}
                      usemanagedidentity: true
                      keyvaultname: ${{ parameters.esrpKeyVaultName }}
                      signcertname: ${{ parameters.esrpSignCertName }}
                      clientid: ${{ parameters.esrpClientId }}
                      intent: PackageDistribution
                      contenttype: npm
                      contentsource: Folder
                      folderlocation: $(Pipeline.Workspace)/npm-packages
                      waitforreleasecompletion: true
                      owners: ${{ parameters.esrpOwner }}
                      approvers: ${{ parameters.esrpApprover }}
                      serviceendpointurl: https://api.esrp.microsoft.com
                      mainpublisher: ESRPRELPACMAN
                      domaintenantid: 975f013f-7f24-47e8-a7d3-abc4752bf346 # PME
