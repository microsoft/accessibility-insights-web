schedules:
    - cron: '0 8 * * 1-5'
      displayName: Weekdays at 8AM UTC (1AM PDT)
      branches:
          include:
              - main
trigger:
    - e2e-reliability/*
pr:
    paths:
        include:
            - src/tests/end-to-end/
            - Dockerfile

# The `resources` specify the location and version of the 1ES PT.
resources:
    repositories:
        - repository: 1esPipelines
          type: git
          name: 1ESPipelineTemplates/1ESPipelineTemplates
          ref: refs/tags/release

extends:
    # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
    # For non-production pipelines, use "Unofficial" as defined below.
    # For productions pipelines, use "Official".
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
    parameters:
        # Update the pool with your team's 1ES hosted pool.
        pool:
            name: $(a11yInsightsPool) # Name of your hosted pool
            image: windows-2022-secure # Name of the image in your pool. If not specified, first image of the pool is used
            os: windows
        settings:
            skipBuildTagsForGitHubPullRequests: true
            # SFI ES-4.2.4: CFSClean blocks the public package feeds. Permissive is the
            # base policy; 1ES currently overrides it with the centrally-applied DefaultDeny.
            networkIsolationPolicy: Permissive,CFSClean
        sdl:
            codeql:
                compiled:
                    enabled: true
                runSourceLanguagesInSourceAnalysis: true

        stages:
            - stage: Stage
              jobs:
                  # Runs in the accessibility-insights org while the feed lives in
                  # accessibility-insights-private, so it needs a cross-org token.
                  - template: pipeline/e2e-job-per-environment.yaml@self
                    parameters:
                        jobNameSuffix: _1
                        feedRegistry: 'https://pkgs.dev.azure.com/accessibility-insights-private/c79273f4-2dcc-480f-852b-0267a30c82db/_packaging/a11y-insights-public/npm/registry/'
                        azureSubscription: 'a11y-insights-public-feed-identity'

                  - template: pipeline/e2e-job-per-environment.yaml@self
                    parameters:
                        jobNameSuffix: _2
                        feedRegistry: 'https://pkgs.dev.azure.com/accessibility-insights-private/c79273f4-2dcc-480f-852b-0267a30c82db/_packaging/a11y-insights-public/npm/registry/'
                        azureSubscription: 'a11y-insights-public-feed-identity'

                  - template: pipeline/e2e-job-per-environment.yaml@self
                    parameters:
                        jobNameSuffix: _3
                        feedRegistry: 'https://pkgs.dev.azure.com/accessibility-insights-private/c79273f4-2dcc-480f-852b-0267a30c82db/_packaging/a11y-insights-public/npm/registry/'
                        azureSubscription: 'a11y-insights-public-feed-identity'

                  - template: pipeline/e2e-job-per-environment.yaml@self
                    parameters:
                        jobNameSuffix: _4
                        feedRegistry: 'https://pkgs.dev.azure.com/accessibility-insights-private/c79273f4-2dcc-480f-852b-0267a30c82db/_packaging/a11y-insights-public/npm/registry/'
                        azureSubscription: 'a11y-insights-public-feed-identity'

                  - template: pipeline/e2e-job-per-environment.yaml@self
                    parameters:
                        jobNameSuffix: _5
                        feedRegistry: 'https://pkgs.dev.azure.com/accessibility-insights-private/c79273f4-2dcc-480f-852b-0267a30c82db/_packaging/a11y-insights-public/npm/registry/'
                        azureSubscription: 'a11y-insights-public-feed-identity'
