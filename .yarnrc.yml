# This prevents inconsistent timeouts during yarn install of the large office fabric fonts package
# See https://github.com/yarnpkg/yarn/issues/5540#issuecomment-374069461
httpTimeout: 120000

nodeLinker: node-modules

# SFI ES-4.2.4: restore from the Central Feed Service feed rather than the public npm
# registry. The ADO pipelines override this at runtime via YARN_NPM_REGISTRY_SERVER and
# supply their own credentials, so this governs local installs and anything else that
# does not set that variable. Reading the feed requires auth to
# accessibility-insights-private: set YARN_NPM_AUTH_TOKEN before running yarn install.
npmRegistryServer: 'https://pkgs.dev.azure.com/accessibility-insights-private/c79273f4-2dcc-480f-852b-0267a30c82db/_packaging/a11y-insights-public/npm/registry/'
npmAlwaysAuth: true

plugins:
    - path: .yarn/plugins/@yarnpkg/plugin-workspace-tools.cjs
      spec: '@yarnpkg/plugin-workspace-tools'

yarnPath: .yarn/releases/yarn-3.5.0.cjs
